# On-prem stack: the app plus a local Ollama server, so no requirement text
# ever leaves the network.
#
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.1:8b
#   open http://localhost:3000

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Local model — no data leaves the host.
      OLLAMA_BASE_URL: http://ollama:11434
      # Cloud providers: uncomment and supply via a .env file next to this one.
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      ENABLE_MOCK_PROVIDER: "1"
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
