name: Đề xuất tính năng
description: Gợi ý rule, định dạng export, model hoặc cải tiến khác
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề bạn đang gặp
      description: Mô tả tình huống thật khi làm QA, đừng chỉ mô tả giải pháp — hiểu vấn đề rồi thường có cách làm tốt hơn.
      placeholder: "Khi bàn giao cho khách hàng ngân hàng, họ yêu cầu mỗi test case phải có ..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Thuộc phần nào
      options:
        - Rule kiểm tra chất lượng
        - Định dạng export
        - AI model / provider
        - Loại đầu vào (tài liệu, user story, API spec...)
        - Giao diện
        - Khác
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Bạn hình dung nó hoạt động ra sao
      description: Nếu là rule mới, cho ví dụ một test case đạt và một test case không đạt.

  - type: textarea
    id: alternatives
    attributes:
      label: Hiện bạn đang xoay sở thế nào
      description: Có cách làm tạm nào không? Rule tự định nghĩa trong Cài đặt đã giải quyết được chưa?
