version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Each of these majors breaks `npm run lint`, and the fix is upstream —
      # revisit when eslint-config-next ships support, then delete the entry.
      #
      # typescript 7: typescript-eslint refuses to run on it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint 10: removed the context API that eslint-plugin-react still uses
      # ("contextOrFilename.getFilename is not a function"). The plugin ships
      # inside eslint-config-next and its latest release still peers on eslint
      # ^9.7, so there is no version to override to.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @types/node must track the oldest Node we support (engines: >=20), not
      # the newest release, or the types describe APIs that are not there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The AI SDK packages must move together — a core/provider version skew
      # breaks the LanguageModel interface.
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
